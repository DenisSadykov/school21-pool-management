server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 8m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' https://fonts.gstatic.com data:; frame-src 'self'; img-src 'self' data: blob:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 35s;
    }
    location /static/ {
        try_files $uri =404;
        expires 1y;
    }
    # Only these mini-app entry pages may run inside Telegram Web.
    # Defining headers here deliberately replaces the server-level DENY/CSP.
    location = /miniapp/penalties {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; img-src 'self' data: blob:; object-src 'none'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; frame-ancestors https://web.telegram.org https://*.web.telegram.org; form-action 'self'; upgrade-insecure-requests" always;
        try_files /index.html =404;
    }
    # Hash routing keeps the entire platform inside this explicitly allowed
    # entry URL. The regular site remains protected by X-Frame-Options DENY.
    location = /miniapp/platform {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; img-src 'self' data: blob:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors https://web.telegram.org https://*.web.telegram.org; form-action 'self'; upgrade-insecure-requests" always;
        try_files /index.html =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
